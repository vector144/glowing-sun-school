<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Sun Rays -->
  <g stroke="#F4A261" stroke-width="4" stroke-linecap="round">
    <line x1="32" y1="4" x2="32" y2="12" />
    <line x1="32" y1="52" x2="32" y2="60" />
    <line x1="4" y1="32" x2="12" y2="32" />
    <line x1="52" y1="32" x2="60" y2="32" />
    <line x1="12" y1="12" x2="18" y2="18" stroke="#E9C46A" />
    <line x1="46" y1="46" x2="52" y2="52" stroke="#E9C46A" />
    <line x1="12" y1="52" x2="18" y2="46" stroke="#E9C46A" />
    <line x1="46" y1="18" x2="52" y2="12" stroke="#E9C46A" />
  </g>
  <!-- Glowing Sun Body -->
  <circle cx="32" cy="32" r="18" fill="url(#sunGlow)" filter="drop-shadow(0 4px 10px rgba(244,162,97,0.4))" />
  <!-- Cute Smiling Eyes & Cheeks -->
  <circle cx="26" cy="29" r="2.5" fill="#263238" />
  <circle cx="38" cy="29" r="2.5" fill="#263238" />
  <circle cx="27" cy="28" r="0.8" fill="#FFFFFF" />
  <circle cx="39" cy="28" r="0.8" fill="#FFFFFF" />
  <!-- Rosy cheeks -->
  <circle cx="22" cy="34" r="2.5" fill="#E76F51" opacity="0.6" />
  <circle cx="42" cy="34" r="2.5" fill="#E76F51" opacity="0.6" />
  <!-- Smiling Mouth -->
  <path d="M 27 34 Q 32 39 37 34" stroke="#263238" stroke-width="2" stroke-linecap="round" fill="none" />
  <defs>
    <linearGradient id="sunGlow" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD166" />
      <stop offset="1" stop-color="#F4A261" />
    </linearGradient>
  </defs>
</svg>